name: Links

on:
  pull_request:
    paths:
      - README.md
      - CONTRIBUTING.md
      - scripts/**
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-links.js